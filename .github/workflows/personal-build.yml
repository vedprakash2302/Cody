name: Personal candidate build

on:
  workflow_dispatch:
    inputs:
      skip_mac:
        description: Publish without a macOS build; Macs keep the previous release's files
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: personal-candidate-build
  cancel-in-progress: false

jobs:
  bundle:
    if: github.repository == 'vedprakash2302/Cody' && github.ref == 'refs/heads/personal/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      clerk_key: ${{ steps.version.outputs.clerk_key }}
      clerk_template: ${{ steps.version.outputs.clerk_template }}
      clerk_oauth: ${{ steps.version.outputs.clerk_oauth }}
      relay_url: ${{ steps.version.outputs.relay_url }}
    steps:
      - name: Checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Check integrated fixes
        run: bash .github/scripts/check-personal-fixes.sh

      - name: Set update-enabled version and public configuration
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_metadata="$(node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --sha "$GITHUB_SHA")"
          version="$(printf '%s\n' "$release_metadata" | sed -n 's/^version=//p')"
          node scripts/update-release-package-versions.ts "$version"
          cp .env.example .env
          set -a
          source .env
          set +a
          {
            echo "version=$version"
            echo "clerk_key=$T3CODE_CLERK_PUBLISHABLE_KEY"
            echo "clerk_template=$T3CODE_CLERK_JWT_TEMPLATE"
            echo "clerk_oauth=$T3CODE_CLERK_CLI_OAUTH_CLIENT_ID"
            echo "relay_url=$T3CODE_RELAY_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  linux:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Cody Linux ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      platform: linux
      target: AppImage
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: linux-${{ matrix.arch }}
      cli_archive: true
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      desktop_update_repository: vedprakash2302/Cody
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_oauth }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  windows:
    needs: [bundle, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Cody Windows ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      platform: win
      target: nsis
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: win32-${{ matrix.arch }}
      cli_archive: false
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      desktop_update_repository: vedprakash2302/Cody
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_oauth }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  mac:
    needs: bundle
    if: ${{ !inputs.skip_mac }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Cody macOS Apple Silicon
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      desktop_update_repository: vedprakash2302/Cody
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_oauth }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  publish:
    needs: [bundle, linux, windows, mac]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' && (needs.mac.result == 'success' || (inputs.skip_mac && needs.mac.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout manifest tools from the release commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install manifest tools
        run: vp install --frozen-lockfile --filter=@t3tools/scripts...

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Download standalone servers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      # Without nightly-mac.yml in the newest release, the Mac updater reports an error.
      - name: Carry the previous macOS files forward
        if: ${{ inputs.skip_mac }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p nightly-mac.yml -D release-assets 2>/dev/null; then
              echo "Carrying macOS files from $tag"
              for file in $(sed -n 's/^ *\(- \)\{0,1\}url: //p' release-assets/nightly-mac.yml); do
                gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$file" -p "$file.blockmap" -D release-assets
              done
              exit 0
            fi
          done
          echo "No earlier release has macOS files." >&2
          exit 1

      - name: Merge and verify updater manifests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/merge-update-manifests.ts --platform win \
            release-assets/nightly-win-x64.yml release-assets/nightly-win-arm64.yml release-assets/nightly.yml
          rm release-assets/nightly-win-x64.yml release-assets/nightly-win-arm64.yml
          for manifest in nightly.yml nightly-mac.yml nightly-linux.yml nightly-linux-arm64.yml; do
            test -s "release-assets/$manifest"
          done

      - name: Publish personal prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bundle.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS
          cd ..
          # electron-updater discovers nightly releases by parsing SemVer tags.
          tag="v${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The in-app updater shows this body as the release's "What's changed".
            node scripts/cody-release-notes.mjs "$GITHUB_REPOSITORY" "$tag" "$GITHUB_SHA" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "Cody $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          # Keep the release out of the updater's feed until all assets are uploaded.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
