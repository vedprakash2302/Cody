name: Personal upstream sync

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'vedprakash2302/t3code' && github.ref == 'refs/heads/personal/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Merge upstream into a candidate checkout
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags origin personal/main
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -b personal/main FETCH_HEAD
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already contains upstream main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-ff upstream/main -m "merge: sync upstream main"; then
            echo "Upstream conflicts with personal fixes. Resolve locally and push personal/main; the remote branch was not changed." >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git log -1 --format='Candidate %H%n%s' >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Vite+
        if: steps.merge.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Check integrated fixes
        if: steps.merge.outputs.changed == 'true'
        run: bash .github/scripts/check-personal-fixes.sh

      - name: Push checked merge
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/personal/main
          echo "Synced personal/main. Run Personal candidate build when you want new installers." >> "$GITHUB_STEP_SUMMARY"
